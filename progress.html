<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fffdfc" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>Commission Progress</title>
  <link rel="stylesheet" href="style.css?v=clean32" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">YourName</a>
    <nav aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="pricing.html">Pricing</a>
      <a href="queue.html">Queue</a>
      <a href="gallery.html">Gallery</a>
      <a href="tos.html">TOS</a>
    </nav>
  </header>

  <main id="mainContent" tabindex="-1" aria-labelledby="progressTitle">
    <section class="panel compact-panel fancy-panel" aria-labelledby="progressTitle" aria-describedby="progressIntro">
      <div class="section-title">
        <div>
          <p class="eyebrow">Private client space</p>
          <h1 id="progressTitle" class="page-title">Progress</h1>
          <p id="progressIntro" class="small">Your commission updates, payment status, files, and messages stay together here.</p>
        </div>
        <a class="btn" href="queue.html">← Back to Queue</a>
      </div>
      <div id="progressArea" aria-busy="true" aria-labelledby="progressTitle" aria-describedby="progressIntro">
        <div class="progress-card">
          <p class="small" role="status">Loading private progress…</p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=2"></script>
  <script src="./sb-api.js?v=20"></script>
  <script src="script.js?v=clean32"></script>
  <script src="./js/client-progress-access.js?v=2"></script>
  <script src="./js/public-ux.js?v=2"></script>
</body>
</html>
