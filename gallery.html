<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fffdfc" />
  <title>Gallery</title>
  <link rel="stylesheet" href="style.css?v=clean32" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">YourName</a>
    <nav aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="pricing.html">Pricing</a>
      <a href="queue.html">Queue</a>
      <a href="gallery.html" aria-current="page">Gallery</a>
      <a href="tos.html">TOS</a>
    </nav>
  </header>

  <main id="mainContent" tabindex="-1">
    <section class="panel compact-panel fancy-panel" aria-labelledby="galleryTitle" aria-describedby="galleryIntro">
      <div class="section-title">
        <div>
          <p class="eyebrow">Selected work</p>
          <h1 class="page-title" id="galleryTitle">Gallery</h1>
          <p class="small" id="galleryIntro">Finished pieces uploaded by the artist appear here. Tap any piece for a larger preview.</p>
        </div>
        <a class="btn" href="pricing.html">Commission Menu →</a>
      </div>
      <div id="galleryGrid" class="gallery-grid" aria-label="Commission artwork gallery">
        <p class="small" role="status">Loading gallery…</p>
      </div>
    </section>

    <section class="home-footer-strip" aria-label="Gallery footer">
      <strong>Like the direction?</strong>
      <span>See available commission options</span>
      <a href="pricing.html">View pricing →</a>
    </section>
  </main>

  <div id="galleryModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Gallery artwork preview">
    <div class="image-modal-card">
      <button class="close" type="button" onclick="closeGalleryPreview()" aria-label="Close preview">×</button>
      <img id="galleryModalImage" src="" alt="Expanded gallery art">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="./sb-api.js?v=20"></script>
  <script src="script.js?v=clean32"></script>
  <script src="./js/public-ux.js?v=2"></script>
</body>
</html>
