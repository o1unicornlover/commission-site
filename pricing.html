<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fffdfc" />
  <title>Pricing</title>
  <link rel="stylesheet" href="style.css?v=pricing34" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">YourName</a>
    <nav aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="pricing.html" aria-current="page">Pricing</a>
      <a href="queue.html">Queue</a>
      <a href="gallery.html">Gallery</a>
      <a href="tos.html">TOS</a>
    </nav>
  </header>

  <main id="mainContent" tabindex="-1">
    <section class="panel compact-panel fancy-panel" aria-labelledby="pricingTitle" aria-describedby="pricingIntro">
      <div class="section-title">
        <div>
          <p class="eyebrow">Commission menu</p>
          <h1 id="pricingTitle" class="page-title">Pricing</h1>
          <p class="small" id="pricingIntro">Browse commission types, starting prices, examples, and what each option includes.</p>
        </div>
        <a class="btn" href="queue.html">Check Queue →</a>
      </div>
      <div id="pricingGrid" class="pricing-grid" aria-busy="true" aria-live="polite" aria-labelledby="pricingTitle" aria-describedby="pricingIntro">
        <p class="small" role="status">Loading commission options…</p>
      </div>
    </section>

    <section class="home-footer-strip" aria-label="Commission reminder">
      <strong>Found your option?</strong>
      <span>Read the terms before requesting</span>
      <a href="tos.html">Read TOS →</a>
    </section>
  </main>

  <dialog id="pricingImageDialog" class="pricing-image-dialog" aria-labelledby="pricingImageTitle">
    <div class="pricing-image-dialog-head">
      <h2 id="pricingImageTitle"></h2>
      <button type="button" class="btn" data-close-pricing-image aria-label="Close image">Close ×</button>
    </div>
    <img id="pricingImageFull" alt="" />
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="./js/pricing-public.js?v=2"></script>
  <script src="./js/public-ux.js?v=2"></script>
</body>
</html>
