<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fffdfc" />
  <title>Terms of Service</title>
  <link rel="stylesheet" href="style.css?v=clean32" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">YourName</a>
    <nav aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="pricing.html">Pricing</a>
      <a href="queue.html">Queue</a>
      <a href="gallery.html">Gallery</a>
      <a href="tos.html" aria-current="page">TOS</a>
    </nav>
  </header>

  <main id="mainContent" tabindex="-1" aria-labelledby="tosTitle">
    <section class="panel compact-panel fancy-panel" aria-labelledby="tosTitle" aria-describedby="tosIntro">
      <div class="section-title">
        <div>
          <p class="eyebrow">Before commissioning</p>
          <h1 id="tosTitle" class="page-title">Terms of Service</h1>
          <p id="tosIntro" class="small">Please read these before requesting a commission. The current saved terms appear below.</p>
        </div>
        <a class="btn" href="pricing.html">View Pricing →</a>
      </div>
      <div id="tosGrid" class="tos-grid" aria-label="Commission terms" aria-live="polite" aria-busy="true">
        <p class="small" role="status">Loading terms…</p>
      </div>
    </section>

    <section class="home-footer-strip" aria-label="Terms footer">
      <strong>Clear terms, easy process.</strong>
      <span>Then check current availability</span>
      <a href="queue.html">View queue →</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="./sb-api.js?v=20"></script>
  <script src="script.js?v=clean32"></script>
  <script src="./js/public-ux.js?v=2"></script>
</body>
</html>
